<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Quimivet PCP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral fixa de navegação + área de trabalho; telas operacionais densas, tipo quadro de PCP */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --surface-2:#ECEFE9; --fg:#18201B; --muted:#5A645D; --line:#D7DCD3;
  --accent:#1D6A50; --accent-fg:#FFFFFF; --accent-soft:#DAEBE2;
  --warn:#9A6300; --warn-soft:#F5E7C8; --crit:#B3261E; --crit-soft:#F7DCD9; --info:#2D5B88; --info-soft:#DCE6F1;
  --shadow:0 8px 30px rgba(20,30,25,.14);
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#191E1B; --surface-2:#212723; --fg:#E4E9E5; --muted:#99A39C; --line:#2E3631;
  --accent:#55B48E; --accent-fg:#0C1510; --accent-soft:#1B3328;
  --warn:#E3AE47; --warn-soft:#3A2E13; --crit:#F2756B; --crit-soft:#3E1D1A; --info:#82B3E4; --info-soft:#1A2A3B;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191E1B; --surface-2:#212723; --fg:#E4E9E5; --muted:#99A39C; --line:#2E3631;
  --accent:#55B48E; --accent-fg:#0C1510; --accent-soft:#1B3328;
  --warn:#E3AE47; --warn-soft:#3A2E13; --crit:#F2756B; --crit-soft:#3E1D1A; --info:#82B3E4; --info-soft:#1A2A3B;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.5rem;font-weight:700} h2{font-size:1.1rem;font-weight:600} h3{font-size:.95rem;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.app>*{min-width:0}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{padding:0 8px}
.brand b{font-family:var(--f-display);font-size:1.15rem;display:block}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 8px;font-size:12px}
.mode{display:inline-flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dot.ok{background:var(--accent)}
main{min-width:0;padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:65ch}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;min-height:40px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.sm{padding:5px 11px;min-height:32px;font-size:13.5px}
.btn.lg{font-size:16.5px;padding:12px 22px;min-height:52px;border-radius:10px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
body.readonly .edit-only{display:none!important}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:16px}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:1100px){.g-2{grid-template-columns:minmax(0,1fr)}}
.g-2w{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1500px){.g-2w{grid-template-columns:minmax(0,1fr)}}
.kpi{padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .v small{font-size:.9rem;font-weight:500;color:var(--muted)}
.kpi .s{font-size:12px;color:var(--muted)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.r{white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.lote{font-family:var(--f-mono);font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:12.5px;white-space:nowrap}
.lote.none{color:var(--muted);font-weight:400;border-style:dashed}

.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.tab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* folha de planejamento */
.sheet{display:grid;gap:16px}
.sheet>*{min-width:0}
.prod-card .panel-h h2 .code{font-family:var(--f-mono);color:var(--muted);font-weight:500;margin-right:6px}
.metrics{display:flex;gap:18px;flex-wrap:wrap}
.metric{display:flex;flex-direction:column}
.metric b{font-family:var(--f-mono);font-size:15px}
.metric span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.metric.crit b{color:var(--crit)} .metric.ok b{color:var(--accent)}
.lots-row{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 8px 8px;align-items:center}
.lotchip{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12.5px;cursor:pointer}
.lotchip:hover{border-color:var(--muted)}

.ledger{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:3px;font-variant-numeric:tabular-nums}
.ledger .l{display:grid;grid-template-columns:90px 1fr;gap:10px}
.ledger .l .q{text-align:right}
.ledger .tot{border-top:1px dashed var(--muted);margin-top:4px;padding-top:6px;font-weight:600}
.ledger .tot.ok{color:var(--accent)} .ledger .tot.crit{color:var(--crit)}

/* calendário */
.cal-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;margin-bottom:1px}
.cal-head div{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.day{background:var(--surface);min-height:118px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day.out{background:var(--surface-2)}
.day.out .dn{opacity:.5}
.day.today .dn{background:var(--accent);color:var(--accent-fg);border-radius:4px;padding:0 5px}
.day.over{outline:2px dashed var(--accent);outline-offset:-3px}
.day .dh{display:flex;justify-content:space-between;align-items:center}
.dn{font-family:var(--f-mono);font-size:12px;font-weight:600}
.day .add{opacity:0;border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 4px}
.day:hover .add{opacity:1}
.dkg{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.chip{border-radius:5px;padding:4px 6px;font-size:12px;cursor:pointer;border-left:3px solid var(--muted);background:var(--surface-2);min-width:0}
.chip .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .c{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.planejada{border-left-color:var(--info);background:var(--info-soft)}
.chip.liberada{border-left-color:var(--warn);background:var(--warn-soft)}
.chip.produzida{border-left-color:var(--accent);background:var(--accent-soft)}
.chip[draggable="true"]{cursor:grab}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* formulários e modal */
.overlay{position:fixed;inset:0;background:rgba(10,15,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);width:min(760px,100%);border:1px solid var(--line)}
.modal.wide{width:min(980px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-b{padding:18px 20px;display:grid;gap:16px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
label.f.span2{grid-column:span 2}
@media (max-width:560px){label.f.span2{grid-column:auto}}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-weight:400;color:var(--fg);min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
input[type=number]{font-family:var(--f-mono)}
.err{color:var(--crit);font-size:13px;font-weight:500}
.note{background:var(--surface-2);border-radius:6px;padding:10px 12px;font-size:13px;color:var(--muted)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.confirm-box{border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:12px 14px;display:grid;gap:10px}
.hist{display:grid;gap:4px;font-size:12.5px}
.hist div{display:grid;grid-template-columns:130px 1fr;gap:8px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:max(20px,env(safe-area-inset-right,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:80;box-shadow:var(--shadow);font-weight:500}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.chart .bar{fill:var(--accent)}
.chart .bar.today{fill:var(--warn)}
.chart .grid{stroke:var(--line)}

.login{min-height:100%;display:grid;place-items:center;padding:24px}
.login .panel{width:min(380px,100%)}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-radius:8px;padding:10px 14px;margin-bottom:16px;border:1px solid}
.banner.crit{background:var(--crit-soft);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.banner.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.banner .btn{color:var(--fg)}
.badge{margin-left:auto;background:var(--crit);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 7px;line-height:18px;font-family:var(--f-mono)}
.badge.warn{background:var(--warn)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:28px 16px;text-align:center;color:var(--muted);cursor:pointer;display:grid;gap:6px;place-items:center}
.drop.over,.drop:hover{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.imp{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.imp.bad{border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.imp.ok{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.bar-mini{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;width:70px;flex:none}
.bar-mini i{display:block;height:100%;background:var(--accent)}
.bar-mini.repor i{background:var(--warn)} .bar-mini.crit i{background:var(--crit)}
pre.raw{max-height:220px;overflow:auto;background:var(--surface-2);padding:10px;border-radius:6px;font-size:11.5px;white-space:pre;margin:8px 0 0}
body.simples .adv{display:none!important}
body.noped .ped-edit{display:none!important}
body.simples .page-head p{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:28px}
.tile{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;min-height:156px;text-decoration:none;color:var(--fg);font:inherit}
.tile:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.tile .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile .ic svg{width:26px;height:26px}
.tile b{font-family:var(--f-display);font-size:1.2rem;font-weight:700}
.tile .cnt{margin-top:auto;font-size:14px;font-weight:600;color:var(--muted)}
.tile.alert .ic{background:var(--crit-soft);color:var(--crit)} .tile.alert .cnt{color:var(--crit)}
.tile.warn .ic{background:var(--warn-soft);color:var(--warn)} .tile.warn .cnt{color:var(--warn)}
.jobs{display:grid;gap:12px}
.job{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.job.late{border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.job h3{font-size:1.3rem;font-family:var(--f-display)}
.job .who{color:var(--muted);margin-top:2px}
.lotebig{font-family:var(--f-mono);font-size:1.5rem;font-weight:700;border:2px solid var(--fg);border-radius:8px;padding:2px 12px;letter-spacing:.02em}
.steps{display:flex;gap:6px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.steps span{padding:2px 8px;border-radius:999px;background:var(--surface-2)}
.steps span.on{background:var(--accent);color:var(--accent-fg)}
.steps span.done{background:var(--accent-soft);color:var(--accent)}
.nav-more summary{list-style:none;cursor:pointer;padding:8px 10px;border-radius:6px;color:var(--muted);font-weight:500;font-size:14px}
.nav-more summary::-webkit-details-marker{display:none}
.nav-more summary:hover{background:var(--surface-2)}
.nav-more[open] summary{color:var(--fg)}
.nav-more .nav{margin-top:2px}
.bigin{font-size:30px!important;padding:12px 14px!important;width:100%;font-family:var(--f-mono)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.chk input{width:18px;height:18px}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));gap:10px}
  .nav{flex-direction:row;overflow-x:auto;width:100%}
  .nav a{white-space:nowrap}
  .side-foot{margin:0;flex-direction:row;flex-wrap:wrap}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .day{min-height:80px}
  .chip .c{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="root"></div>

<script>
/* =====================================================================
   QUIMIVET PCP — Fase 1
   Para usar com Firebase, cole aqui a configuração do seu projeto
   (Firebase Console → Configurações do projeto → Seus apps → Config).
   Enquanto ficar null, o sistema roda em MODO DEMONSTRAÇÃO e guarda
   os dados apenas neste navegador.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSy...",
  authDomain: "quimivet-pcp.firebaseapp.com",
  projectId: "quimivet-pcp",
  storageBucket: "quimivet-pcp.firebasestorage.app",
  messagingSenderId: "1234567890",
  appId: "1:1234567890:web:abc123"
};
/* Exemplo:
const FIREBASE_CONFIG = {
  apiKey: "...", authDomain: "seu-projeto.firebaseapp.com",
  projectId: "seu-projeto", storageBucket: "seu-projeto.appspot.com",
  messagingSenderId: "...", appId: "..."
};
*/

/* E-mail automático (opcional) pelo EmailJS — passo a passo no LEIA-ME.
   Enquanto ficar null, os avisos aparecem só dentro do sistema. */
const EMAILJS_CONFIG = null;
/* Exemplo: const EMAILJS_CONFIG = { publicKey: "...", serviceId: "service_...", templateId: "template_..." }; */

const CAPACIDADE = 500;            // kg máximos por batida
const LS_KEY = 'quimivet-pcp-v4';
const FB_VER = '10.12.2';

let S = {produtos:{}, materias:{}, pedidos:{}, batidas:{}, movimentos:{}, compras:{}, config:{proximoLote:1}};
let MODE = FIREBASE_CONFIG ? 'fb' : 'local';
let PERFIL = 'producao';
let USER = null, fs = null, auth = null;
let VIEW = 'painel';
let CAL = null;
let PED_FILTRO = 'aberto';
let CAD_TAB = 'produtos';
let READY = false;
let SIMPLES = true; try { SIMPLES = localStorage.getItem('qpcp-detalhes') !== '1'; } catch(e){}
const VIEWS = ['inicio','painel','analise','pedidos','planejamento','calendario','lotes','estoque','compras','cadastros'];
const viewPadrao = () => PERFIL==='diretor' ? 'painel' : PERFIL==='adm' ? 'pedidos' : 'inicio';

/* ---------- utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-5);
const isoDate = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const hoje = () => isoDate(new Date());
const addDias = (iso, n) => { const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoDate(d); };
const fd = iso => iso ? iso.split('-').reverse().join('/') : '—';
const nf = n => Number(n||0).toLocaleString('pt-BR', {maximumFractionDigits:1});
const agora = () => new Date().toISOString();
const quem = () => USER ? (USER.email || 'usuário') : (PERFIL==='diretor' ? 'Diretor' : 'Produção');
const diasEntre = (a, b) => Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/86400000);
const clone = o => JSON.parse(JSON.stringify(o));
const canEdit = () => PERFIL === 'producao';
const canPedidos = () => PERFIL === 'producao' || PERFIL === 'adm';
function toast(msg){ $$('.toast').forEach(x => x.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }

/* ---------- persistência ---------- */
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function loadLocal(){ try{ const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }

const Store = {
  async put(col, obj){
    obj = clone(obj); S[col][obj.id] = obj;
    if (MODE==='fb') await fs.collection(col).doc(obj.id).set(obj); else saveLocal();
    render();
  },
  async contador(campo){
    if (MODE==='fb'){
      const ref = fs.collection('config').doc('geral');
      return fs.runTransaction(async t => { const c = await t.get(ref); const n = (c.exists && c.data()[campo]) || 1; t.set(ref, {[campo]:n+1}, {merge:true}); return n; });
    }
    const n = S.config[campo] || 1; S.config[campo] = n+1; saveLocal(); return n;
  },
  async putMany(list){
    list = list.map(([c,o]) => [c, clone(o)]); list.forEach(([c,o]) => S[c][o.id] = o);
    if (MODE==='fb'){ const bt = fs.batch(); list.forEach(([c,o]) => bt.set(fs.collection(c).doc(o.id), o)); await bt.commit(); } else saveLocal();
    render();
  },
  async del(col, id){
    delete S[col][id];
    if (MODE==='fb') await fs.collection(col).doc(id).delete(); else saveLocal();
    render();
  },
  async setConfig(patch){
    Object.assign(S.config, patch);
    if (MODE==='fb') await fs.collection('config').doc('geral').set(patch, {merge:true}); else saveLocal();
    render();
  },
  /* Gera o próximo número de lote de forma atômica e fixa na batida. */
  async gerarLote(batidaId){
    if (MODE==='fb'){
      const cRef = fs.collection('config').doc('geral'), bRef = fs.collection('batidas').doc(batidaId);
      const n = await fs.runTransaction(async t => {
        const c = await t.get(cRef), b = await t.get(bRef);
        if (!b.exists || b.data().lote) throw new Error('Esta batida já tem lote.');
        const num = (c.exists && c.data().proximoLote) || 1;
        const hist = (b.data().historico||[]).concat([{em:agora(), por:quem(), txt:`Lote ${num} gerado`}]);
        t.set(cRef, {proximoLote:num+1}, {merge:true});
        t.update(bRef, {lote:num, status:'liberada', liberadoEm:agora(), historico:hist});
        return num;
      });
      return n;
    }
    const b = S.batidas[batidaId];
    if (b.lote) throw new Error('Esta batida já tem lote.');
    const num = S.config.proximoLote || 1;
    b.lote = num; b.status = 'liberada'; b.liberadoEm = agora();
    b.historico = (b.historico||[]).concat([{em:agora(), por:quem(), txt:`Lote ${num} gerado`}]);
    S.config.proximoLote = num + 1;
    saveLocal(); render();
    return num;
  }
};

const produtos = () => Object.values(S.produtos).sort((a,b)=> (a.ordem??99)-(b.ordem??99) || String(a.codigo).localeCompare(String(b.codigo), 'pt', {numeric:true}));
const prodNome = id => S.produtos[id]?.nome || '—';
const curto = n => String(n||'').replace(/\s*-\s*1\s?KG$/i,'');
const prodCod = id => S.produtos[id]?.codigo ?? '?';
const prodPorCodigo = c => Object.values(S.produtos).find(p => String(p.codigo) === String(c));
const ativas = () => Object.values(S.batidas).filter(b => b.status !== 'cancelada');
const kgBatida = b => b.status==='produzida' ? (b.kgReal ?? b.kg) : b.kg;
const alocadoBatida = b => (b.alocacoes||[]).reduce((s,a)=>s+a.qtd, 0);
const saldoBatida = b => kgBatida(b) - alocadoBatida(b) + (b.ajustes||[]).reduce((s,a)=>s+a.qtd,0);
let IDX = null;
function indice(){
  if (IDX) return IDX;
  const aloc = new Map(), ped = new Set();
  for (const b of Object.values(S.batidas)) if (b.status !== 'cancelada') for (const a of b.alocacoes||[]){
    const k = a.pedidoId+'|'+a.item; if (!aloc.has(k)) aloc.set(k, []); aloc.get(k).push({b, a}); ped.add(a.pedidoId); }
  return IDX = {aloc, ped};
}
function alocacoesItem(pid, i){ return indice().aloc.get(pid+'|'+i) || []; }
const alocadoItem = (pid, idx) => alocacoesItem(pid, idx).reduce((s,x)=>s+x.a.qtd, 0);
function pedidoTemAlocacao(pid){ return indice().ped.has(pid); }
function statusPedido(p){
  if (p.expedido) return 'expedido';
  let tot=0, al=0, prontos=true;
  p.itens.forEach((it,i) => { tot += it.qtd; const xs = alocacoesItem(p.id, i); xs.forEach(x => { al += x.a.qtd; if (x.b.status!=='produzida') prontos=false; }); });
  if (al===0) return 'aguardando';
  if (al < tot) return 'parcial';
  return prontos ? 'pronto' : 'programado';
}
const ST_PED = {aguardando:['Aguardando programação','crit'], parcial:['Parcial','warn'], programado:['Programado','info'], pronto:['Pronto p/ expedir','ok'], expedido:['Expedido','']};
const ST_BAT = {planejada:['Planejada','info'], liberada:['Lote gerado','warn'], produzida:['Produzida','ok'], cancelada:['Cancelada','crit']};
const pillPed = s => `<span class="pill ${ST_PED[s][1]}">${ST_PED[s][0]}</span>`;
const pillBat = s => `<span class="pill ${ST_BAT[s][1]}">${ST_BAT[s][0]}</span>`;
const loteTag = b => b.lote ? `<span class="lote">${b.lote}</span>` : `<span class="lote none">sem lote</span>`;

function itensPendentes(produtoId){
  const out=[];
  for (const p of Object.values(S.pedidos)){
    if (p.expedido) continue;
    p.itens.forEach((it,i) => {
      if (produtoId && it.produtoId!==produtoId) return;
      const pend = it.qtd - alocadoItem(p.id, i);
      if (pend > 0) out.push({p, i, it, pend});
    });
  }
  return out.sort((a,b) => (a.p.dataPrevista||'9999').localeCompare(b.p.dataPrevista||'9999') || (a.p.emissao||'').localeCompare(b.p.emissao||'') || String(a.p.numero).localeCompare(String(b.p.numero)));
}
function resumoProduto(pid){
  const pend = itensPendentes(pid).reduce((s,x)=>s+x.pend, 0);
  let estoque=0, programado=0;
  for (const b of ativas()) if (b.produtoId===pid){ const s = saldoBatida(b); if (s<=0) continue; if (b.status==='produzida') estoque+=s; else programado+=s; }
  const falta = Math.max(0, pend - estoque - programado);
  return {pend, estoque, programado, falta, batidas: Math.ceil(falta/CAPACIDADE)};
}
function consumoMP(produtoId, kg){
  const p = S.produtos[produtoId]; if (!p || !p.formula?.length) return [];
  return p.formula.map(f => ({mp: S.materias[f.mpId], kg: f.kgPor500 * kg / CAPACIDADE})).filter(x => x.mp);
}

function clientesBatida(b){
  const nomes = [...new Set((b.alocacoes||[]).map(a => S.pedidos[a.pedidoId]?.cliente).filter(Boolean))];
  return esc(nomes.map(n => n.split(' ').slice(0,2).join(' ')).join(', '));
}
function chartProducao(){
  const h = hoje(), dias = [...Array(14)].map((_,i) => addDias(h, i-13));
  const vals = dias.map(d => ativas().filter(b => b.status==='produzida' && b.data===d).reduce((s,b)=>s+kgBatida(b),0));
  const W=640, H=200, pl=44, pb=24, pt=10, max = Math.max(1000, Math.ceil(Math.max(...vals)/500)*500);
  const bw = (W-pl)/dias.length;
  const y = v => pt + (H-pt-pb) * (1 - v/max);
  const ticks = []; for (let v=0; v<=max; v+=500) ticks.push(v);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Produção diária em kg">
    ${ticks.map(v => `<line class="grid" x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('')}
    ${vals.map((v,i) => { const x = pl + i*bw + bw*.18, w = bw*.64; const wd = new Date(dias[i]+'T12:00:00').getDay();
      return `${v?`<rect class="bar ${dias[i]===h?'today':''}" x="${x}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="2"><title>${fd(dias[i])}: ${nf(v)} kg</title></rect>`:''}
      <text x="${x+w/2}" y="${H-6}" text-anchor="middle" ${wd===0||wd===6?'opacity=".45"':''}>${dias[i].slice(8)}</text>`; }).join('')}
  </svg>`;
}

/* ---------- PEDIDOS ---------- */
let PED_BUSCA = '';
function producaoPedido(p){
  const vistos = new Set(), out = [];
  p.itens.forEach((_,i) => alocacoesItem(p.id,i).forEach(({b}) => { if (vistos.has(b.id)) return; vistos.add(b.id);
    out.push(b.lote ? `<div><span class="lote">${b.lote}</span> <span class="small ${b.status==='produzida'?'':'muted'}">${b.status==='produzida'?'produzido':'programado'} ${fd(b.data).slice(0,5)}</span></div>` : `<div class="small muted">programado ${fd(b.data).slice(0,5)}</div>`); }));
  return out.join('') || '<span class="muted">—</span>';
}
function vPedidos(){
  const all = Object.values(S.pedidos).map(p => ({p, s: statusPedido(p)}));
  const F = {aberto: x => x.s!=='expedido', pronto: x => x.s==='pronto', expedido: x => x.s==='expedido', todos: () => true};
  const q = PED_BUSCA.trim().toLowerCase();

async function salvarPedido(id){
  const err = $('#pErr'); err.textContent='';
  const numero = id ? S.pedidos[id].numero : $('#pNum').value.trim();
  const cliente = $('#pCli').value.trim();
  if (!numero) return err.textContent = 'Informe o número do pedido.';
  if (!id && S.pedidos[numero]) return err.textContent = `O pedido ${numero} já foi lançado.`;
  if (!cliente) return err.textContent = 'Informe o cliente.';
  let itens = id && pedidoTemAlocacao(id) ? S.pedidos[id].itens : $$('#itRows tr').map(tr => ({produtoId: $('.it-prod',tr).value, qtd: +$('.it-qtd',tr).value||0})).filter(it => it.produtoId || it.qtd);
  if (!itens.length) return err.textContent = 'Inclua pelo menos um item.';
  if (itens.some(it => !it.produtoId || it.qtd<=0)) return err.textContent = 'Cada item precisa de produto e quantidade maior que zero.';
  const impK = $('#fPed').dataset.imp;
  const base = id ? S.pedidos[id] : {id: numero, numero, criadoEm: agora(), criadoPor: quem(), ...(impK!=='' && window._imp?.[+impK] ? {origem:'pdf', arquivo:window._imp[+impK].arquivo} : {})};
  await Store.put('pedidos', {...base, emissao:$('#pEmi').value, vendedor:$('#pVen').value.trim(), cliente, cidade:$('#pCid').value.trim(), uf:$('#pUf').value.trim().toUpperCase(), dataPrevista:$('#pPrev').value, obs:$('#pObs').value.trim(), itens});
  closeModal(); toast(id ? 'Pedido atualizado' : `Pedido ${numero} lançado`);
  if (impK!=='' && window._imp?.[+impK]){ window._imp[+impK].lancado = true; window._imp[+impK].numero = numero; modalImportar(true); }
}

function textoComercial(p){
  const l = [`Pedido ${p.numero} – ${p.cliente}`];
  p.itens.forEach((it,i) => {
    const xs = alocacoesItem(p.id, i).filter(x => x.b.lote);
    const pend = it.qtd - alocadoItem(p.id, i);
    l.push(`${prodNome(it.produtoId)} ${nf(it.qtd)} kg: ` + (xs.length ? xs.map(x => `lote ${x.b.lote} (${fd(x.b.data)})${xs.length>1?' '+nf(x.a.qtd)+' kg':''}`).join(' + ') : 'aguardando lote') + (pend>0 && xs.length ? ` · faltam ${nf(pend)} kg` : ''));
  });
  return l.join('\n');
}

      <div class="tbl-wrap"><table><thead><tr><th>Pedido</th><th>Cliente</th><th class="adv">Emissão</th><th class="adv">Previsão</th><th class="r">Falta (kg)</th><th></th></tr></thead><tbody>
      ${its.map(x => `<tr><td class="mono"><a href="#" data-act="pedido" data-id="${esc(x.p.id)}">${esc(x.p.numero)}</a></td><td>${esc(x.p.cliente)} <span class="muted small adv">${esc(x.p.cidade||'')}${x.p.uf?'/'+esc(x.p.uf):''}</span></td><td class="mono adv">${fd(x.p.emissao)}</td><td class="mono adv">${x.p.dataPrevista?fd(x.p.dataPrevista):'—'}</td><td class="r mono"><b>${nf(x.pend)}</b>${x.pend<x.it.qtd?` <span class="muted">de ${nf(x.it.qtd)}</span>`:''}</td><td class="r"><button class="btn sm edit-only" data-act="atender" data-id="${esc(x.p.id)}" data-i="${x.i}">Atender</button></td></tr>`).join('')}
      </tbody></table></div>
      ${abertas.length?`<div class="lots-row"><span class="eyebrow">Saldo disponível</span>${abertas.map(b => `<span class="lotchip" data-act="batida" data-id="${b.id}">${loteTag(b)} <span class="mono">${nf(saldoBatida(b))} kg</span> <span class="muted small">${b.status==='produzida'?'estoque':fd(b.data).slice(0,5)}</span></span>`).join('')}</div>`:''}
    </section>`; }).join('') : `<div class="panel empty">Toda a demanda está atendida. Quando entrar um pedido novo, ele aparece aqui.</div>`}
  ${sem.length?`<div class="small muted">Sem pedidos pendentes: ${sem.map(p=>esc(p.nome)).join(' · ')}</div>`:''}

const ordemFifo = (a,b) => (a.status==='produzida'?0:1)-(b.status==='produzida'?0:1) || a.data.localeCompare(b.data) || (a.lote||1e9)-(b.lote||1e9);

function ledger(prodId, kg, alocs, ajustes=[]){
  const tot = alocs.reduce((s,a)=>s+a.qtd,0), sobra = kg - tot + ajustes.reduce((s,a)=>s+a.qtd,0);
  return `<div class="ledger">
    <div class="l"><span class="q">${nf(kg)} kg</span><span>${esc(prodNome(prodId))} · batida</span></div>
    ${alocs.map(a => { const p = S.pedidos[a.pedidoId]; return `<div class="l"><span class="q">− ${nf(a.qtd)}</span><span>${esc(p?.numero||a.pedidoId)} · ${esc((p?.cliente||'').split(' ').slice(0,3).join(' '))}</span></div>`; }).join('')}
    ${ajustes.map(a => `<div class="l"><span class="q">${a.qtd<0?'− '+nf(-a.qtd):'+ '+nf(a.qtd)}</span><span>ajuste · ${esc(a.motivo)}</span></div>`).join('')}
    <div class="l tot ${sobra<0?'crit':'ok'}"><span class="q">${sobra<0?'− '+nf(-sobra):nf(sobra)} kg</span><span>${sobra<0?'excede a batida':sobra>0?'sobra → estoque':'batida fechada'}</span></div>
  </div>`;
}

          ${its.length ? `<div class="tbl-wrap"><table><thead><tr><th></th><th>Pedido</th><th>Cliente</th><th class="r">Pend.</th><th class="r">Nesta batida</th></tr></thead><tbody>
          ${its.map(x => { const q = Math.min(x.pend, Math.max(0,rest)); rest -= q; return `<tr data-pid="${esc(x.p.id)}" data-i="${x.i}" data-pend="${x.pend}"><td><input type="checkbox" class="nb-chk" ${q>0?'checked':''} aria-label="Incluir pedido ${esc(x.p.numero)}"></td><td class="mono">${esc(x.p.numero)}</td><td class="small">${esc(x.p.cliente)}</td><td class="r mono">${nf(x.pend)}</td><td class="r"><input type="number" class="nb-q" min="0" max="${x.pend}" step="10" value="${q||''}" style="width:90px"></td></tr>`; }).join('')}
          </tbody></table></div><button class="btn sm" data-act="nbAuto" style="margin-top:8px">Distribuir automaticamente</button>` : '<div class="note">Nenhum pedido pendente para este produto. A batida inteira vai para o estoque.</div>'}
        </div>
        <div class="grid" style="gap:12px"><div><div class="eyebrow" style="margin-bottom:6px">Conta da batida</div><div id="nbLedger"></div></div><div id="nbMp"></div></div>
      </div>`;

  };
  const alocs = () => $$('#nbBody tr[data-pid]').filter(tr => $('.nb-chk',tr).checked && +$('.nb-q',tr).value>0).map(tr => ({pedidoId:tr.dataset.pid, item:+tr.dataset.i, qtd:+$('.nb-q',tr).value}));

async function salvarBatida(){
  const err = $('#nbErr'); err.textContent='';
  const pid = $('#nbProd').value, kg = +$('#nbKg').value||0, data = $('#nbData').value;
  if (!pid) return err.textContent = 'Escolha o produto.';
  if (!data) return err.textContent = 'Informe a data de produção.';
  if (kg<=0 || kg>CAPACIDADE) return err.textContent = `A batida deve ter entre 1 e ${CAPACIDADE} kg.`;
  const al = window._nb.alocs();
  for (const tr of $$('#nbBody tr[data-pid]')) if (+$('.nb-q',tr).value > +tr.dataset.pend) return err.textContent = 'Uma das quantidades é maior que o pendente do pedido.';
  if (al.reduce((s,a)=>s+a.qtd,0) > kg) return err.textContent = 'Os pedidos somam mais do que a batida. Aumente a batida ou reduza as quantidades.';
  const b = {id:uid(), produtoId:pid, data, kg, status:'planejada', lote:null, alocacoes:al, criadoEm:agora(), historico:[{em:agora(), por:quem(), txt:`Batida de ${kg} kg planejada para ${fd(data)}`}]};
  await Store.put('batidas', b);
  closeModal(); toast('Batida programada'); modalBatida(b.id);
}

        <td class="r"><input type="number" id="at_${b.id}" min="1" max="${Math.min(pend,saldoBatida(b))}" step="10" value="${Math.min(pend,saldoBatida(b))}" style="width:90px"></td>
        <td class="r"><button class="btn sm ${k===0?'pri':''}" data-act="alocar" data-b="${b.id}" data-p="${esc(pedId)}" data-i="${i}">Alocar</button></td></tr>`).join('')}
      </tbody></table></div>` : `<div class="note">Não há saldo de ${esc(prodNome(it.produtoId))} em estoque nem em batidas programadas.</div>`}
      <div class="err" id="atErr"></div>
    </div>
    <div class="modal-f"><button class="btn" data-act="close">Fechar</button><button class="btn" data-act="novaBatida" data-p="${it.produtoId}">Criar nova batida</button></div>`, 'wide');
}
async function alocar(bId, pedId, i){
  const b = clone(S.batidas[bId]), it = S.pedidos[pedId].itens[i];
  const pend = it.qtd - alocadoItem(pedId, i), q = +$('#at_'+bId).value||0;
  if (q<=0) return $('#atErr').textContent = 'Informe a quantidade.';
  if (q>pend) return $('#atErr').textContent = `O item só tem ${nf(pend)} kg pendentes.`;
  if (q>saldoBatida(b)) return $('#atErr').textContent = `Este lote só tem ${nf(saldoBatida(b))} kg de saldo.`;
  const ex = b.alocacoes.find(a => a.pedidoId===pedId && a.item===i);
  if (ex) ex.qtd += q; else b.alocacoes.push({pedidoId:pedId, item:i, qtd:q});
  b.historico.push({em:agora(), por:quem(), txt:`${nf(q)} kg alocados ao pedido ${S.pedidos[pedId].numero}`});
  await Store.put('batidas', b);
  toast(b.lote ? `Lote ${b.lote} vinculado ao pedido` : 'Pedido incluído na batida');
  const restante = it.qtd - alocadoItem(pedId, i);
  if (restante>0) modalAtender(pedId, i); else modalPedido(pedId);
}

/* ---------- CALENDÁRIO ---------- */
function vCalendario(){
  if (!CAL){ const d = new Date(); CAL = {y:d.getFullYear(), m:d.getMonth()}; }
  const first = new Date(CAL.y, CAL.m, 1), start = new Date(first); start.setDate(1 - ((first.getDay()+6)%7));
  const h = hoje(), mes = first.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  const cells = [];
  for (let i=0;i<42;i++){ const d = new Date(start); d.setDate(start.getDate()+i); cells.push(isoDate(d)); if (i>=34 && i%7===6 && d.getMonth()!==CAL.m) break; }
  const byDay = {}; ativas().forEach(b => (byDay[b.data] ||= []).push(b));
  return `
  <div class="page-head"><div><h1>Calendário de produção</h1><p>Cada cartão é uma batida, com produto, quantidade, lote e clientes de destino. Arraste uma batida planejada para outro dia para reprogramar. Depois que o lote é gerado, a data fica fixa.</p></div>
    <div class="actions"><button class="btn" data-act="calNav" data-d="-1" aria-label="Mês anterior">←</button><b style="min-width:150px;text-align:center">${mes.charAt(0).toUpperCase()+mes.slice(1)}</b><button class="btn" data-act="calNav" data-d="1" aria-label="Próximo mês">→</button><button class="btn" data-act="calNav" data-d="0">Hoje</button></div></div>
  <div class="legend" style="margin-bottom:10px"><span><i style="background:var(--info)"></i>Planejada</span><span><i style="background:var(--warn)"></i>Lote gerado</span><span><i style="background:var(--accent)"></i>Produzida</span></div>
  <div class="tbl-wrap"><div style="min-width:760px">
  <div class="cal-head">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d=>`<div>${d}</div>`).join('')}</div>
  <div class="cal">${cells.map(d => { const bs = (byDay[d]||[]).sort((a,b)=>(a.lote||1e9)-(b.lote||1e9)); const kg = bs.reduce((s,b)=>s+kgBatida(b),0);
    return `<div class="day ${d.slice(5,7)!=String(CAL.m+1).padStart(2,'0')?'out':''} ${d===h?'today':''}" data-day="${d}">
      <div class="dh"><span class="dn">${+d.slice(8)}</span>${kg?`<span class="dkg">${nf(kg)} kg</span>`:''}<button class="add edit-only" data-act="novaBatidaDia" data-d="${d}" aria-label="Nova batida em ${fd(d)}">+</button></div>
      ${bs.map(b => `<div class="chip ${b.status}" data-act="batida" data-id="${b.id}" draggable="${b.status==='planejada'&&canEdit()}" title="${esc(prodNome(b.produtoId))} · ${nf(b.kg)} kg">
        <div class="t">${b.lote?`<span class="mono">${b.lote}</span> · `:''}${esc(prodNome(b.produtoId).replace(/ - ?1 ?KG$/i,''))}</div>
        <div class="c"><span class="mono">${nf(kgBatida(b))} kg</span>${b.alocacoes?.length?' · '+clientesBatida(b):''}</div></div>`).join('')}
    </div>`; }).join('')}</div></div></div>`;
}
function bindCalendario(){
  let dragId = null;
  $$('.chip[draggable="true"]').forEach(c => c.addEventListener('dragstart', e => { dragId = c.dataset.id; e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed='move'; }));
  $$('.day').forEach(d => {
    d.addEventListener('dragover', e => { if (dragId){ e.preventDefault(); d.classList.add('over'); } });
    d.addEventListener('dragleave', () => d.classList.remove('over'));
    d.addEventListener('drop', async e => { e.preventDefault(); d.classList.remove('over'); const b = clone(S.batidas[dragId]); dragId=null;
      if (!b || b.status!=='planejada' || b.data===d.dataset.day) return;
      b.historico.push({em:agora(), por:quem(), txt:`Reprogramada de ${fd(b.data)} para ${fd(d.dataset.day)}`}); b.data = d.dataset.day;
      await Store.put('batidas', b); toast(`Batida movida para ${fd(b.data)}`); });
  });
}

/* ---------- ESTOQUE DE MATÉRIA-PRIMA ---------- */
const movs = () => Object.values(S.movimentos||{});
const mpUn = m => m?.unidade || 'kg';
function saldoMP(id){ return movs().filter(m => m.mpId===id).reduce((s,m)=>s+m.qtd, 0); }
function saldosLoteMP(id){
  const L = {};
  for (const m of movs().filter(m => m.mpId===id && m.loteFornecedor)){
    const k = m.loteFornecedor; L[k] ||= {lote:k, saldo:0, validade:'', data:m.data};
    L[k].saldo += m.qtd;
    if (m.tipo==='entrada'){ if (m.validade) L[k].validade = m.validade; L[k].data = m.data; }
  }
  return Object.values(L).filter(x => x.saldo > 0.0005).sort((a,b) => (a.validade||'9999').localeCompare(b.validade||'9999') || a.data.localeCompare(b.data));
}
function comprometidoMP(id, excetoBatida){
  let t = 0;
  for (const b of ativas()) if ((b.status==='planejada' || b.status==='liberada') && b.id!==excetoBatida)
    for (const c of consumoMP(b.produtoId, b.kg)) if (c.mp.id===id) t += c.kg;
  return t;
}
function consumoMedioDia(id){
  const ini = addDias(hoje(), -30);
  return movs().filter(m => m.mpId===id && m.tipo==='saida' && m.data>=ini).reduce((s,m)=>s-m.qtd, 0) / 30;
}
function situacaoMP(m){
  const saldo = saldoMP(m.id), comp = comprometidoMP(m.id), cmd = consumoMedioDia(m.id);
  const lead = +m.prazoEntrega || 7, seg = m.diasSeguranca ?? 5, cob = m.diasCobertura ?? 30;
  const disp = saldo - comp;
  const ponto = +m.estoqueMinimo > 0 ? +m.estoqueMinimo : Math.max(cmd*(lead+seg), comp);
  const dur = cmd > 0 ? disp/cmd : Infinity;
  let st;
  if (cmd===0 && comp===0) st = saldo < 0 ? 'crit' : 'semuso';
  else if (disp < 0 || dur < lead) st = 'crit';
  else if (disp <= ponto) st = 'repor';
  else st = 'ok';
  let sug = 0;
  const emCompra = comprasAbertasMP(m.id).reduce((t,c) => t + faltaReceber(c), 0);
  if (st==='crit' || st==='repor'){
    sug = Math.max(comp, cmd*lead) + cmd*(seg+cob) - saldo;
    if (+m.estoqueMinimo > 0) sug = Math.max(sug, +m.estoqueMinimo*1.5 - saldo);
    sug = Math.max(0, sug - emCompra);
    if (sug > 0) sug = +m.multiploCompra > 0 ? Math.ceil(sug / +m.multiploCompra) * +m.multiploCompra : Math.ceil(sug);
    if (sug === 0 && emCompra > 0) st = 'comprando';
  }
  return {saldo, comp, disp, cmd, ponto, dur, st, sug, lead, seg, cob, emCompra};
}
const ST_MP = {crit:['Comprar já','crit'], repor:['Repor','warn'], comprando:['Em compra','info'], ok:['OK','ok'], semuso:['Sem consumo','']};
const pillMP = s => `<span class="pill ${ST_MP[s][1]}">${ST_MP[s][0]}</span>`;
function vencimentos(dias){
  const lim = addDias(hoje(), dias), out = [];
  for (const m of Object.values(S.materias)) if (m.controlaLote)
    for (const l of saldosLoteMP(m.id)) if (l.validade && l.validade <= lim) out.push({m, ...l});
  return out.sort((a,b) => a.validade.localeCompare(b.validade));
}
function calcBaixa(b, kg){
  const out = [];
  for (const c of consumoMP(b.produtoId, kg)){
    let rest = Math.round(c.kg*1000)/1000;
    if (c.mp.controlaLote) for (const l of saldosLoteMP(c.mp.id)){ if (rest <= 0) break; const q = Math.min(rest, l.saldo); out.push({mpId:c.mp.id, qtd:q, loteFornecedor:l.lote}); rest -= q; }
    if (rest > 0.0005) out.push({mpId:c.mp.id, qtd:rest, loteFornecedor:''});
  }
  return out;
}
function tabelaNecessidadeMP(prodId, kg, excetoBatida){
  const mp = consumoMP(prodId, kg);
  if (!mp.length) return `<div class="note small">Cadastre a fórmula deste produto para ver a matéria-prima necessária.</div>`;
  return `<div class="ledger">${mp.map(c => { const disp = saldoMP(c.mp.id) - comprometidoMP(c.mp.id, excetoBatida), falta = c.kg - disp;
    return `<div class="l"><span class="q">${nf(c.kg)} ${esc(mpUn(c.mp))}</span><span>${esc(c.mp.nome)} ${falta>0.0005?`<b style="color:var(--crit)">· falta ${nf(falta)}</b>`:`<span class="muted">· disp. ${nf(disp)}</span>`}</span></div>`; }).join('')}</div>`;
}
function blocoMPBatida(b){
  if (b.origem==='saldo') return '';

/* ---------- IMPORTAÇÃO DE PDF DO PEDIDO ---------- */
const PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let PDFJS_P = null;
function loadPdfJs(){
  return PDFJS_P ||= (async () => {
    await loadScript(PDFJS_BASE+'pdf.min.js');
    await loadScript(PDFJS_BASE+'pdf.worker.min.js');   // roda o leitor na própria página
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE+'pdf.worker.min.js';
  })().catch(e => { PDFJS_P = null; throw e; });
}
async function textoPdf(file){
  await loadPdfJs();
  const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  const out = [];
  for (let n=1; n<=pdf.numPages; n++){
    const tc = await (await pdf.getPage(n)).getTextContent();
    const its = tc.items.filter(i => i.str && i.str.trim()).map(i => ({s:i.str, x:i.transform[4], y:i.transform[5], w:i.width, h:Math.abs(i.transform[3])||10}));
    const rows = [];
    its.sort((a,b) => b.y-a.y || a.x-b.x).forEach(it => { const r = rows.find(r => Math.abs(r.y-it.y) < Math.max(2.5, it.h*0.4)); if (r) r.items.push(it); else rows.push({y:it.y, items:[it]}); });
    rows.sort((a,b) => b.y-a.y).forEach(r => {
      r.items.sort((a,b) => a.x-b.x); let line = '', end = null;
      for (const it of r.items){ if (end!==null){ const gap = it.x-end; line += gap > 6 ? '   ' : gap > 0.8 ? ' ' : ''; } line += it.s; end = it.x + it.w; }
      out.push(line.replace(/\s+$/,''));
    });
  }
  return out;
}
const UFS = 'AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
const br2iso = s => { const m = String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : ''; };
const numBR = s => +String(s).replace(/\./g,'').replace(',','.');
const normNome = s => String(s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/-?\s*1\s?KG\b/g,'').replace(/[^A-Z0-9]/g,'');
function parsePedido(lines){
  const T = lines.join('\n'), r = {numero:'', emissao:'', vendedor:'', cliente:'', cidade:'', uf:'', obs:'', itens:[], avisos:[]};
  let m = T.match(/N[úu]mero:?[^\n]*\n[^\S\n]*(\d{6,})[^\S\n]+(\d{2}\/\d{2}\/\d{4})/i);
  if (m){ r.numero = m[1]; r.emissao = br2iso(m[2]); }
  if (!r.numero){ m = T.match(/N[úu]mero:?[^\S\n]*(\d{6,})/i); if (m) r.numero = m[1]; }
  if (!r.emissao){ m = T.match(/Emi(?:tido em|ss[ãa]o):?\s*(\d{2}\/\d{2}\/\d{4})/i); if (m) r.emissao = br2iso(m[1]); }
  m = T.match(/Vendedor:?[^\S\n]*([^\n]+)/i); if (m) r.vendedor = m[1].split(/\s{2,}/)[0].trim();
  m = T.match(/Cliente:?[^\S\n]*([^\n]+)/i); if (m) r.cliente = m[1].split(/\s{2,}/)[0].replace(/\s+\d{9,}.*$/,'').trim();
  m = T.match(/Cep:?[^\S\n]*[\d.\-]{8,10}[^\S\n]+([^\n]+)/i); if (m) r.cidade = m[1].split(/\s{2,}|Cel:|Fone:|Contato:/i)[0].trim();
  const iC = T.search(/Cliente:/i), iD = T.search(/Descri[çc][ãa]o/i);
  const bloco = iC>=0 ? T.slice(iC, iD>iC ? iD : undefined) : '';
  const ufs = [...bloco.matchAll(/(?:^|\s)([A-Z]{2})(?=\s|$)/gm)].map(x => x[1]).filter(u => UFS.includes(u));
  if (ufs.length) r.uf = ufs[ufs.length-1];
  m = T.match(/OBS:?[^\S\n]*([^\n]*)/i); if (m) r.obs = m[1].trim();
  for (const ln of lines){
    const x = ln.match(/^\s*(\d{1,4})\s+(\d{1,6})\s+(.+?)\s+(KG|UN|CX|PC|SC|LT|L)\s+([\d.]+(?:,\d+)?)(?=\s|$)/i);
    if (!x) continue;
    const cod = x[2], desc = x[3].trim(), qtd = numBR(x[5]);
    let p = prodPorCodigo(cod);
    const pn = Object.values(S.produtos).find(pp => normNome(pp.nome) === normNome(desc));
    if (p && pn && p.id !== pn.id) r.avisos.push(`Código ${cod} no PDF é "${desc}", mas no cadastro o código ${cod} é "${p.nome}". Confira o código interno em Cadastros.`);
    if (!p && pn){ p = pn; r.avisos.push(`"${desc}" veio com o código ${cod}, que não está no cadastro. Associei pelo nome.`); }
    if (!p) r.avisos.push(`Produto não encontrado no cadastro: código ${cod}, "${desc}".`);
    if (x[4].toUpperCase()!=='KG') r.avisos.push(`"${desc}" veio na unidade ${x[4]}. Confira a quantidade em kg.`);
    r.itens.push({codigo:cod, descricao:desc, qtd, produtoId: p?.id || ''});
  }
  if (!r.numero) r.avisos.unshift('Não encontrei o número do pedido.');
  if (!r.cliente) r.avisos.push('Não encontrei o cliente.');
  if (!r.itens.length) r.avisos.push('Não encontrei itens no pedido.');
  return r;
}
function statusImp(r){
  if (r.lendo) return ['Lendo…',''];
  if (r.erro) return ['Não foi possível ler','crit'];
  if (r.lancado) return ['Lançado','ok'];
  if (r.numero && S.pedidos[r.numero]) return ['Já lançado antes',''];
  if (r.avisos.length || r.itens.some(i => !i.produtoId)) return ['Conferir','warn'];
  return ['Pronto para lançar','info'];
}
function modalImportar(manter){
  if (!manter) window._imp = [];
  const imp = window._imp;
  const prontos = imp.filter(r => statusImp(r)[0]==='Pronto para lançar');
  openModal(`

      <label class="drop" id="impDrop"><input type="file" id="impFile" accept="application/pdf,.pdf" multiple hidden>

      ${imp.map((r,k) => { const [st,cl] = statusImp(r); return `<div class="imp ${cl==='crit'?'bad':cl==='info'||cl==='ok'?'ok':''}">
        <div class="actions" style="justify-content:space-between"><div><span class="small muted">${esc(r.arquivo)}</span><div><b class="mono">${esc(r.numero||'sem número')}</b> ${r.cliente?'· '+esc(r.cliente):''} <span class="small muted">${esc(r.cidade||'')}${r.uf?'/'+esc(r.uf):''}${r.emissao?' · emitido '+fd(r.emissao):''}${r.vendedor?' · '+esc(r.vendedor):''}</span></div></div><span class="pill ${cl}">${st}</span></div>
        ${r.erro ? `<div class="err">${esc(r.erro)}</div>` : r.lendo ? '' : `
        <div class="small">${r.itens.map(i => `<span class="mono muted">${esc(i.codigo)}</span> ${esc(i.produtoId ? prodNome(i.produtoId) : i.descricao)} <b class="mono">${nf(i.qtd)} kg</b>${i.produtoId?'':' <span class="pill crit">sem cadastro</span>'}`).join(' &nbsp;·&nbsp; ')}</div>
        ${r.obs?`<div class="small"><b>OBS:</b> ${esc(r.obs)}</div>`:''}
        ${r.avisos.length?`<div class="note warn small">${r.avisos.map(esc).join('<br>')}</div>`:''}
        ${!r.lancado && !(r.numero && S.pedidos[r.numero]) ? `<div class="actions"><button class="btn sm" data-act="revisarImp" data-k="${k}">Conferir e editar</button>${st==='Pronto para lançar'?`<button class="btn sm pri" data-act="lancarImp" data-k="${k}">Lançar</button>`:''}</div>` : ''}`}
        ${r.linhas?.length ? `<details><summary class="small muted" style="cursor:pointer">Ver o texto lido do PDF</summary><pre class="raw">${esc(r.linhas.join('\n'))}</pre></details>` : ''}
      </div>`; }).join('')}
    </div>
    <div class="modal-f"><button class="btn" data-act="close">Fechar</button>${prontos.length>1?`<button class="btn pri" data-act="lancarTodosImp">Lançar os ${prontos.length} prontos</button>`:''}</div>`, 'wide');
  const drop = $('#impDrop');
  $('#impFile').addEventListener('change', e => processarPdfs(e.target.files));
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); processarPdfs(e.dataTransfer.files); });
}
async function processarPdfs(files){
  const novos = [...files].filter(f => /\.pdf$/i.test(f.name) || f.type==='application/pdf');
  if (!novos.length) return toast('Escolha arquivos em PDF.');
  const regs = novos.map(f => ({arquivo:f.name, lendo:true, itens:[], avisos:[]}));
  window._imp.push(...regs); modalImportar(true);
  for (let i=0; i<novos.length; i++){
    const r = regs[i];
    try {
      const linhas = await textoPdf(novos[i]);
      if (!linhas.join('').trim()) { Object.assign(r, {lendo:false, erro:'Este PDF não tem texto (parece uma folha escaneada ou foto). Gere o PDF direto do sistema de vendas, imprimindo em "Microsoft Print to PDF".'}); }
      else Object.assign(r, parsePedido(linhas), {lendo:false, linhas});
    } catch(e){ Object.assign(r, {lendo:false, erro: /Falha ao carregar/.test(e.message) ? 'Não consegui carregar o leitor de PDF. Verifique a conexão com a internet.' : 'Não foi possível ler este arquivo: '+e.message}); }
    if ($('#impDrop')) modalImportar(true);
  }
}
function pedidoDeImp(r){
  return {id:r.numero, numero:r.numero, emissao:r.emissao||hoje(), vendedor:r.vendedor, cliente:r.cliente, cidade:r.cidade, uf:r.uf, obs:r.obs, dataPrevista:'',
    itens: r.itens.map(i => ({produtoId:i.produtoId, qtd:i.qtd})), origem:'pdf', arquivo:r.arquivo, criadoEm:agora(), criadoPor:quem()};
}
async function lancarImp(k){
  const r = window._imp[k]; if (statusImp(r)[0]!=='Pronto para lançar') return;
  await Store.put('pedidos', pedidoDeImp(r)); r.lancado = true; modalImportar(true); toast(`Pedido ${r.numero} lançado`);
}

const faltaReceber = c => Math.max(0, c.qtd - (c.qtdRecebida||0));
const ST_SC = {solicitada:['Aguardando diretor','crit'], cotacao:['Em cotação','warn'], comprada:['Comprado','info'], recebida:['Recebido','ok'], recusada:['Recusada',''], cancelada:['Cancelada','']};
const scNum = c => 'SC-' + String(c.numero).padStart(4,'0');

function pillSC(c){ const [t,cl] = ST_SC[c.status]; return atrasada(c) ? `<span class="pill crit">Entrega atrasada</span>` : `<span class="pill ${cl}">${t}</span>`; }
function tempoEspera(c){ const h = horasDesde(c.solicitadoEm); return h < 1 ? 'agora há pouco' : h < 24 ? `há ${Math.floor(h)} h` : `há ${Math.floor(h/24)} dia(s)`; }

let EMAIL_P = null;
async function enviarEmail(para, assunto, mensagem){
  if (!EMAILJS_CONFIG || !para) return false;
  try {

async function novaSC(mpId, qtd, precisaAte, urgente, obs){
  const m = S.materias[mpId], s = situacaoMP(m);
  const numero = await Store.contador('proximaSC');
  const c = {id:uid(), numero, mpId, qtd, qtdSugerida:s.sug, precisaAte, urgente, obs, status:'solicitada', solicitadoEm:agora(), solicitadoPor:quem(),
    saldoNoPedido:Math.round(s.saldo*10)/10, duraDias: s.dur===Infinity ? null : Math.max(0, Math.floor(s.dur)), qtdRecebida:0, lembretes:0,
    historico:[{em:agora(), por:quem(), txt:`Solicitada: ${nf(qtd)} ${mpUn(m)}${urgente?' (urgente)':''}`}]};
  const ok = await enviarEmail(S.config.emailDiretor, `${urgente?'[URGENTE] ':''}Solicitação de compra ${scNum(c)} – ${m.nome}`, textoSC(c));

async function enviarSC(mpId){

async function responderSC(id){
  const c = clone(S.compras[id]), st = $('#rsSt').value, prev = $('#rsPrev').value, q = +$('#rsQtd').value, forn = $('#rsForn').value.trim(), obs = $('#rsObs').value.trim();
  if (st==='comprada' && !prev) return $('#rsErr').textContent = 'Informe a previsão de entrega.';
  if (st==='recusada' && !obs) return $('#rsErr').textContent = 'Explique o motivo para a produção.';
  if (!(q>0)) return $('#rsErr').textContent = 'Informe a quantidade.';
  const m = S.materias[c.mpId], mud = [];
  if (st!==c.status) mud.push(ST_SC[st][0]);
  if (q!==c.qtd) mud.push(`quantidade ${nf(c.qtd)} → ${nf(q)} ${mpUn(m)}`);
  if (prev && prev!==c.previsao && st!=='recusada') mud.push(`previsão de entrega ${fd(prev)}`);
  if (forn && forn!==c.fornecedor) mud.push(`fornecedor ${forn}`);
  if (obs && obs!==c.respostaObs) mud.push(`"${obs}"`);
  Object.assign(c, {status:st, previsao: st==='recusada' ? '' : prev, qtd:q, fornecedor:forn, respostaObs:obs, respondidoEm: c.respondidoEm || agora()});
  c.historico.push({em:agora(), por:quem(), txt: mud.length ? mud.join(' · ') : 'Resposta salva'});
  if (c.status==='recusada') c.encerradoEm = agora();
  const ok = await enviarEmail(S.config.emailProducao, `${scNum(c)} ${m.nome}: ${ST_SC[st][0]}`, `${scNum(c)} – ${m.nome}\nSituação: ${ST_SC[st][0]}\n${c.previsao?'Previsão de entrega: '+fd(c.previsao)+'\n':''}${forn?'Fornecedor: '+forn+'\n':''}${obs?'Observação: '+obs+'\n':''}`);
  if (ok) c.historico.push({em:agora(), por:'sistema', txt:`E-mail enviado para ${S.config.emailProducao}`});
  await Store.put('compras', c); modalCompra(id); toast('Resposta enviada à produção');
}

/* lembretes: faixa fixa, pop-up periódico, contador na aba e e-mail diário */
let LEMBRETE_EM = 0, LEMBRETE_TIMER = null;
function faixaAvisos(){
  if (PERFIL==='diretor'){
    const ag = aguardandoDiretor(); if (!ag.length) return '';
    const urg = ag.filter(c => c.urgente).length, velha = ag.filter(c => horasDesde(c.solicitadoEm) > 24).length;
    return `<div class="banner ${urg||velha?'crit':'warn'}"><span><b>${ag.length} solicitação(ões) de compra aguardando sua resposta</b>${urg?` · ${urg} urgente(s)`:''}${velha?` · ${velha} há mais de 24 h`:''}</span><a href="#compras" class="btn sm" data-act="irAguardando">Responder agora</a></div>`;
  }
  if (canEdit()){
    const atr = comprasL().filter(atrasada); if (!atr.length) return '';
    return `<div class="banner warn"><span><b>${atr.length} compra(s) com entrega atrasada:</b> ${atr.map(c => `${scNum(c)} ${esc(S.materias[c.mpId]?.nome||'')} (previsto ${fd(c.previsao)})`).join(', ')}</span><a href="#compras" class="btn sm">Ver compras</a></div>`;
  }
  return '';
}
function lembrarDiretor(forcar){
  if (PERFIL!=='diretor' || $('#overlay')) return;
  const ag = aguardandoDiretor(); if (!ag.length) return;
  if (!forcar && Date.now() - LEMBRETE_EM < 30*60000) return;
  LEMBRETE_EM = Date.now();
  openModal(`
    <div class="modal-h"><div><div class="eyebrow">Lembrete</div><h2>${ag.length} solicitação(ões) de compra aguardando você</h2></div><button class="btn ghost" data-act="close" aria-label="Fechar">✕</button></div>
    <div class="modal-b"><div class="tbl-wrap"><table><tbody>
      ${ag.map(c => { const m = S.materias[c.mpId]; return `<tr class="click" data-act="compra" data-id="${c.id}"><td class="mono"><b>${scNum(c)}</b></td><td><b>${esc(m?.nome||'?')}</b><div class="small muted">${nf(c.qtd)} ${esc(mpUn(m))} · precisa até ${fd(c.precisaAte)} · ${tempoEspera(c)}</div></td><td>${c.urgente?'<span class="pill crit">urgente</span>':''}</td><td class="r"><button class="btn sm pri" data-act="compra" data-id="${c.id}">Responder</button></td></tr>`; }).join('')}
    </tbody></table></div><div class="small muted">Este aviso volta a aparecer a cada 30 minutos enquanto houver solicitações sem resposta.</div></div>
    <div class="modal-f"><button class="btn" data-act="close">Lembrar mais tarde</button></div>`);
}
async function lembretesEmail(){
  if (!EMAILJS_CONFIG || !S.config.emailDiretor || !canEdit()) return;
  for (const c of aguardandoDiretor()){
    if (horasDesde(c.ultimoLembrete || c.solicitadoEm) < 24) continue;
    const m = S.materias[c.mpId];
    const ok = await enviarEmail(S.config.emailDiretor, `Lembrete: ${c.urgente?'[URGENTE] ':''}${scNum(c)} – ${m?.nome} aguarda resposta ${tempoEspera(c)}`, textoSC(c));
    if (ok){ const n = clone(c); n.ultimoLembrete = agora(); n.lembretes = (n.lembretes||0)+1; n.historico.push({em:agora(), por:'sistema', txt:`Lembrete por e-mail nº ${n.lembretes} enviado`}); await Store.put('compras', n); }
  }
}
function iniciarLembretes(){
  if (LEMBRETE_TIMER) return;
  LEMBRETE_TIMER = setInterval(() => { lembrarDiretor(false); lembretesEmail(); }, 5*60000);
  setTimeout(() => { lembrarDiretor(true); lembretesEmail(); }, 600);
}

/* ---------- ANÁLISE (gestão) ---------- */
let AN = {per:'12m', grp:'', prod:''};
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const semanaIni = iso => addDias(iso, -((new Date(iso+'T12:00:00').getDay()+6)%7));
const chave = (iso,g) => g==='dia' ? iso : g==='semana' ? semanaIni(iso) : g==='mes' ? iso.slice(0,7) : iso.slice(0,4);
const rotulo = (k,g) => g==='dia'||g==='semana' ? k.slice(8)+'/'+k.slice(5,7) : g==='mes' ? MESES[+k.slice(5,7)-1]+'/'+k.slice(2,4) : k;
function primeiraData(){ let m = hoje(); for (const b of Object.values(S.batidas)) if (b.data < m && b.origem!=='saldo') m = b.data; return m; }
function faixaAnalise(){
  const h = hoje(); let ini, g;
  if (AN.per==='30d'){ ini = addDias(h,-29); g = 'dia'; }
  else if (AN.per==='90d'){ ini = addDias(h,-89); g = 'semana'; }
  else if (AN.per==='ano'){ ini = h.slice(0,4)+'-01-01'; g = 'mes'; }
  else if (AN.per==='tudo'){ ini = primeiraData(); g = 'mes'; }
  else { const d = new Date(h+'T12:00:00'); d.setDate(1); d.setMonth(d.getMonth()-11); ini = isoDate(d); g = 'mes'; }
  g = AN.grp || g; const dias = diasEntre(ini,h)+1;
  return {ini, fim:h, g, dias, pIni:addDias(ini,-dias), pFim:addDias(ini,-1)};
}
function chavesEntre(ini, fim, g){ const out = []; let last = null; for (let d = ini; d <= fim; d = addDias(d,1)){ const k = chave(d,g); if (k!==last){ out.push(k); last = k; } } return out; }
const batsProd = (ini,fim,prod) => Object.values(S.batidas).filter(b => b.status==='produzida' && b.origem!=='saldo' && b.data>=ini && b.data<=fim && (!prod || b.produtoId===prod));
const pedsPer = (ini,fim,prod) => Object.values(S.pedidos).filter(p => p.emissao>=ini && p.emissao<=fim && (!prod || p.itens.some(i => i.produtoId===prod)));
const kgPed = (p,prod) => p.itens.filter(i => !prod || i.produtoId===prod).reduce((s,i)=>s+i.qtd, 0);
const media = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
function resumoPer(ini, fim, prod){
  const bs = batsProd(ini,fim,prod), ps = pedsPer(ini,fim,prod);
  const kg = bs.reduce((s,b)=>s+kgBatida(b),0), n = bs.length;
  const tempos = [];
  for (const p of ps){ let max = null, ok = true;
    p.itens.forEach((it,i) => { if (prod && it.produtoId!==prod) return; const xs = alocacoesItem(p.id,i);
      if (xs.reduce((s,x)=>s+x.a.qtd,0) < it.qtd) ok = false;
      xs.forEach(x => { if (x.b.status!=='produzida') ok = false; if (!max || x.b.data > max) max = x.b.data; }); });
    if (ok && max) tempos.push(Math.max(0, diasEntre(p.emissao, max))); }
  const cs = comprasL().filter(c => { const d = c.solicitadoEm.slice(0,10); return d>=ini && d<=fim; });
  const rec = cs.filter(c => c.status==='recebida' && c.previsao && c.encerradoEm);
  return {kg, n, aprov: n ? kg/(n*CAPACIDADE) : null, kgP: ps.reduce((s,p)=>s+kgPed(p,prod),0), nP: ps.length, tAt: media(tempos),
    nC: cs.length, resp: media(cs.filter(c=>c.respondidoEm).map(c => (new Date(c.respondidoEm)-new Date(c.solicitadoEm))/3600000)),
    prazo: rec.length ? rec.filter(c => c.encerradoEm.slice(0,10) <= c.previsao).length / rec.length : null, bs, ps, cs};
}
function delta(a, b, menorMelhor){
  if (a==null || !b) return '<span class="muted">sem base de comparação</span>';
  const p = (a-b)/b, bom = menorMelhor ? p < 0 : p > 0;
  if (Math.abs(p) < 0.005) return '<span class="muted">igual ao período anterior</span>';
  return `<span style="color:${bom?'var(--accent)':'var(--crit)'};font-weight:600">${p>0?'▲':'▼'} ${nf(Math.abs(p*100))}%</span> <span class="muted">vs período anterior</span>`;
}
function niceStep(x){ if (x <= 0) return 1; const p = 10**Math.floor(Math.log10(x)), f = x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
const nfK = v => v >= 10000 ? nf(v/1000)+' t' : nf(v);
function grafico(labels, series, tipo='bar', H=230){
  const W = 760, pl = 56, pr = 12, pt = 14, pb = 30, n = Math.max(1, labels.length);
  const vals = series.flatMap(s => s.vals).filter(v => v!=null), top = Math.max(1, ...vals);
  const step = niceStep(top/4), max = Math.ceil(top/step)*step;
  const bw = (W-pl-pr)/n, y = v => pt + (H-pt-pb)*(1 - v/max);
  let g = ''; for (let v = 0; v <= max+1e-9; v += step) g += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${nfK(v)}</text>`;
  const every = Math.ceil(n/12); let xl = '';
  labels.forEach((l,i) => { if (i % every === 0) xl += `<text x="${pl+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${l}</text>`; });
  let mk = '';
  if (tipo==='bar'){ const k = series.length, gw = Math.min(bw*0.72, 40*k), w = gw/k;
    series.forEach((s,si) => s.vals.forEach((v,i) => { if (!v) return; const x = pl + i*bw + (bw-gw)/2 + si*w;
      mk += `<rect x="${x}" y="${y(v)}" width="${Math.max(1,w-1)}" height="${y(0)-y(v)}" rx="1.5" style="fill:${s.cor}"><title>${labels[i]} · ${s.nome}: ${nf(v)} kg</title></rect>`; })); }
  else series.forEach(s => { let d = '', pen = false, pts = '';
    s.vals.forEach((v,i) => { if (v==null){ pen = false; return; } const X = pl+i*bw+bw/2, Y = y(v); d += (pen?'L':'M')+X.toFixed(1)+' '+Y.toFixed(1)+' '; pen = true;
      pts += `<circle cx="${X}" cy="${Y}" r="3.2" style="fill:${s.cor}"><title>${labels[i]} · ${s.nome}: ${nf(v)} kg</title></circle>`; });
    mk += `<path d="${d}" fill="none" style="stroke:${s.cor}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${pts}`; });
  const leg = series.length > 1 ? `<div class="legend" style="margin-top:8px">${series.map(s => `<span><i style="background:${s.cor}"></i>${s.nome}</span>`).join('')}</div>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico">${g}${mk}${xl}</svg>${leg}`;
}
function vAnalise(){
  const F = faixaAnalise(), prod = AN.prod;
  const A = resumoPer(F.ini, F.fim, prod), B = resumoPer(F.pIni, F.pFim, prod);
  const keys = chavesEntre(F.ini, F.fim, F.g), labels = keys.map(k => rotulo(k, F.g));

  A.bs.forEach(b => { const k = chave(b.data, F.g); sp[k] = (sp[k]||0) + kgBatida(b); });
  A.ps.forEach(p => { const k = chave(p.emissao, F.g); sd[k] = (sd[k]||0) + kgPed(p, prod); });
  // comparativo anual

  const cores = ['var(--muted)','var(--info)','var(--warn)','var(--accent)'];

    return {p, kg, n:a.length, kgB: b.reduce((s,x)=>s+kgBatida(x),0), aprov: a.length ? kg/(a.length*CAPACIDADE) : null}; }).filter(x => x.kg || x.kgB).sort((a,b)=>b.kg-a.kg);

  const cA = cons(F.ini,F.fim), cB = cons(F.pIni,F.pFim);

  const pct = v => v==null ? '—' : nf(v*100)+'%';

function openModal(html, size=''){

  const lista = [

    ['7','BIOTAURUS',false],['9','QUIMIVET HORSE - 1KG',false],['10','KAVAJU POTROS - 1 KG',false]];
  const produtos = {};
  lista.forEach(([c,n,ok],i) => { const id = 'p'+c; produtos[id] = {id, codigo:c, nome:n, unPorCaixa:10, formula:[], codigoConfirmado:ok, ordem:i}; });
  return {produtos, materias:{}, pedidos:{}, batidas:{}, movimentos:{}, compras:{}, config:{proximoLote:1}};

    MV({mpId:m.id, tipo:'entrada', qtd:e1, data:addDias(h,-40), origem:'compra', nf:'NF '+(31200+i*3), fornecedor:m.fornecedor, loteFornecedor:m._l1, validade: m.controlaLote ? addDias(h, 150+i*20) : ''});

/* ---------- inicialização ---------- */
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Falha ao carregar '+src)); document.head.appendChild(s); }); }
function telaLogin(msg){
  $('#root').innerHTML = `<div class="login"><form class="panel" id="fLogin"><div class="panel-h"><div><b style="font-family:var(--f-display);font-size:1.2rem">Quimivet PCP</b><div class="small muted">Entre com seu e-mail da empresa</div></div></div>
    <div class="panel-b grid" style="gap:12px"><label class="f">E-mail<input id="lgEmail" type="email" required autocomplete="username"></label><label class="f">Senha<input id="lgSenha" type="password" required autocomplete="current-password"></label>
    <div class="err" id="lgErr">${esc(msg||'')}</div><button class="btn pri" type="submit">Entrar</button></div></form></div>`;
  $('#fLogin').addEventListener('submit', async e => { e.preventDefault(); try { await auth.signInWithEmailAndPassword($('#lgEmail').value, $('#lgSenha').value); } catch(err){ $('#lgErr').textContent = 'E-mail ou senha incorretos.'; } });
}
async function initFirebase(){
  $('#root').innerHTML = '<div class="empty">Conectando…</div>';
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  await loadScript(base+'firebase-app-compat.js');
  await Promise.all([loadScript(base+'firebase-auth-compat.js'), loadScript(base+'firebase-firestore-compat.js')]);
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth(); fs = firebase.firestore();
  let unsubs = [];
  auth.onAuthStateChanged(async u => {
    unsubs.forEach(f => f()); unsubs = []; READY = false;
    if (!u){ USER = null; return telaLogin(); }
    USER = u;
    const perf = await fs.collection('usuarios').doc(u.uid).get();
    if (!perf.exists) return telaLogin(`Seu usuário (${u.email}) ainda não tem perfil. Peça ao administrador para cadastrar o UID ${u.uid} na coleção "usuarios".`);
    PERFIL = ['producao','diretor','adm'].includes(perf.data().perfil) ? perf.data().perfil : 'adm';
    S = {produtos:{}, materias:{}, pedidos:{}, batidas:{}, movimentos:{}, compras:{}, config:{proximoLote:1}};
    let pend = 7;
    const done = () => { if (--pend===0){ READY = true; render(); if (!Object.keys(S.produtos).length && canEdit()) ofertarSeed(); } };
    ['produtos','materias','pedidos','batidas','movimentos','compras'].forEach(col => { let first = true;
      unsubs.push(fs.collection(col).onSnapshot(snap => { S[col] = {}; snap.forEach(d => S[col][d.id] = d.data()); if (first){ first=false; done(); } else render(); }, e => toast('Erro ao ler '+col+': '+e.message))); });
    let fc = true;
    unsubs.push(fs.collection('config').doc('geral').onSnapshot(d => { S.config = {proximoLote:1, ...(d.data()||{})}; if (fc){ fc=false; done(); } else render(); }));
  });
}
function ofertarSeed(){
  openModal(`<div class="modal-h"><h2>Banco de dados vazio</h2></div><div class="modal-b"><p>Quer cadastrar agora os 10 produtos da Quimivet? Depois você confere os códigos e completa as fórmulas em Cadastros.</p></div>
  <div class="modal-f"><button class="btn" data-act="close">Agora não</button><button class="btn pri" data-act="seedProdutos" onclick="setTimeout(closeModal,50)">Cadastrar os 10 produtos</button></div>`);
}
(function start(){
  VIEW = location.hash.slice(1); if (!VIEWS.includes(VIEW)) VIEW=viewPadrao();
  if (MODE==='fb'){ initFirebase().catch(e => { $('#root').innerHTML = `<div class="empty">Não foi possível conectar ao Firebase: ${esc(e.message)}</div>`; }); return; }
  S = loadLocal() || seedDemo(); S.movimentos ||= {}; S.compras ||= {}; saveLocal(); READY = true; render();
})();
